<!DOCTYPE html>
<html lang="es">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V83L0PW82X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-V83L0PW82X');

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fontanela — Encuentra tu fuente</title>

<!-- Leaflet & Plugins CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #10293B;
    --ink-70: #3C5468;
    --ink-40: #7C93A3;
    --ink-10: #F3F7F8;
    --teal: #1F9E96;
    --teal-dark: #147169;
    --coral: #E2542D;
    --paper: #FFFFFF;
    --line: #DCE3E7;
    --shadow-sm: 0 4px 12px rgba(16,41,59,0.08);
    --shadow-lg: 0 12px 32px rgba(16,41,59,0.16);
    --border-rad: 16px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: 'Work Sans', sans-serif; color: var(--ink); overflow: hidden; }
  
  #map { position: absolute; inset: 0; z-index: 0; transition: filter 0.3s ease; }
  .leaflet-routing-container { display: none !important; }
  .leaflet-top.leaflet-right { margin-top: 70px; }
  
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(31, 158, 150, 0.6); }
  .marker-cluster div { background-color: rgba(20, 113, 105, 0.9); color: white; font-family: 'Work Sans', sans-serif; font-weight: 600; }
  .custom-drop { background: transparent; border: none; }

  /* Elementos base de UI */
  .brand, .search-container, .panel, .fab-container { transition: opacity 0.3s ease, transform 0.3s ease; }

  .brand {
    position: absolute; top: 16px; left: 16px; z-index: 500;
    background: var(--paper); padding: 14px 20px; border-radius: var(--border-rad);
    box-shadow: var(--shadow-sm); max-width: 280px;
  }
  .brand h1 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 4px 0; letter-spacing: -0.02em; color: var(--teal-dark); }
  .brand p { margin: 0; font-size: 13px; color: var(--ink-70); line-height: 1.4; }

  .search-container { position: absolute; top: 16px; left: 320px; z-index: 500; width: 360px; display: flex; flex-direction: column; }
  .search-input-wrapper { display: flex; background: var(--paper); border-radius: 30px; box-shadow: var(--shadow-sm); padding: 6px 20px; align-items: center; gap: 10px; }
  .search-input-wrapper input { border: none; outline: none; font-family: 'Work Sans', sans-serif; font-size: 15px; width: 100%; padding: 8px 0; color: var(--ink); background: transparent; font-weight: 500; }
  .search-input-wrapper input::placeholder { color: var(--ink-40); }
  .search-results { background: var(--paper); border-radius: var(--border-rad); box-shadow: var(--shadow-lg); margin-top: 8px; overflow: hidden; display: none; max-height: 250px; overflow-y: auto; }
  .search-result-item { padding: 12px 20px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid var(--line); color: var(--ink-70); line-height: 1.4; }
  .search-result-item:hover { background: var(--ink-10); color: var(--ink); }

  .panel { position: absolute; z-index: 500; background: var(--paper); box-shadow: var(--shadow-lg); border-radius: var(--border-rad); display: flex; flex-direction: column; overflow: hidden; left: 16px; bottom: 16px; width: 350px; max-height: calc(100vh - 120px); transition: transform 0.3s ease; }
  #panel-content { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
  .panel.collapsed #panel-content { display: none; }
  .chevron { transition: transform 0.3s ease; color: var(--ink-40); }
  .panel.collapsed .chevron { transform: rotate(180deg); }

  .panel-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; background: var(--paper); z-index: 2; cursor: pointer; user-select: none; }
  @media (min-width: 769px) { .panel-head:hover { background: var(--ink-10); } }
  .panel-head-titles { display: flex; flex-direction: column; gap: 2px; }
  .panel-head h2 { font-size: 16px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .panel-head span { font-size: 13px; color: var(--ink-40); font-weight: 500; }
  
  .fav-filter { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink-70); font-weight: 600; transition: 0.2s; font-family: 'Work Sans', sans-serif;}
  .fav-filter.active { background: #FDE8E8; border-color: var(--coral); color: var(--coral); }
  .data-source { font-size: 12.5px; color: var(--ink-40); padding: 12px 20px 4px; font-weight: 500; }
  #list { overflow-y: auto; padding: 0 0 12px; flex: 1; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
  
  .fountain-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.2s; border-bottom: 1px solid rgba(0,0,0,0.03); }
  .fountain-item:hover { background: var(--ink-10); }
  .fountain-item.nearest { border-left: 3px solid var(--teal); background: #EEF8F7; }
  .f-info { flex: 1; }
  .f-dist { color: var(--teal-dark); font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .f-time { color: var(--ink-40); font-weight: 500; font-size: 13px;}
  .f-name { font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--ink); }
  .fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; color: var(--line); transition: 0.2s; }
  .fav-btn.active { color: var(--coral); }
  .f-go { background: var(--ink-10); color: var(--ink); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; text-decoration: none; transition: 0.2s; }
  .f-go:hover { background: var(--teal); color: white; }

  .fab-container { position: absolute; right: 16px; bottom: 16px; z-index: 500; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .fab { width: 52px; height: 52px; border-radius: 50%; border: none; box-shadow: var(--shadow-lg); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
  .fab:active { transform: scale(0.92); }
  .fab svg { width: 22px; height: 22px; }
  .fab-locate { background: var(--ink); color: white; }
  .fab-locate.tracking { background: var(--teal); animation: pulse-shadow 2s infinite; }

  @keyframes pulse-shadow { 0% { box-shadow: 0 0 0 0 rgba(31,158,150,0.4); } 70% { box-shadow: 0 0 0 12px rgba(31,158,150,0); } 100% { box-shadow: 0 0 0 0 rgba(31,158,150,0); } }

  .overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(16,41,59,0.7); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .overlay-card { background: var(--paper); border-radius: 20px; padding: 32px; max-width: 360px; text-align: center; box-shadow: var(--shadow-lg); }
  .overlay-icon { width: 56px; height: 56px; background: var(--ink-10); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--teal); }
  .overlay-card h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 12px 0; color: var(--ink); }
  .overlay-card p { font-size: 14px; color: var(--ink-70); line-height: 1.5; margin: 0 0 24px 0; }
  
  .btn-primary { background: var(--teal); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; font-family: 'Work Sans', sans-serif;}
  .btn-secondary { background: transparent; border: none; color: var(--ink-40); font-size: 14px; font-weight: 500; margin-top: 14px; cursor: pointer; text-decoration: underline; width: 100%; font-family: 'Work Sans', sans-serif;}

  .leaflet-popup-content-wrapper { border-radius: 14px; padding: 4px; box-shadow: var(--shadow-lg); }
  .leaflet-popup-content { margin: 14px 16px; font-family: 'Work Sans', sans-serif;}
  .popup-btn-group { display: flex; gap: 8px; margin-top: 14px; margin-bottom: 8px;}
  .popup-btn { background: var(--teal); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; font-family: 'Work Sans', sans-serif;}
  .popup-btn-sec { background: var(--ink-10); color: var(--ink); border: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; font-family: 'Work Sans', sans-serif;}
  .route-icon { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; border-radius: 50%; }

  /* =========================================
     MODO NAVEGACIÓN (Estilo Google Maps)
     ========================================= */
  .nav-ui { display: none; }
  
  body.nav-mode .brand,
  body.nav-mode .search-container,
  body.nav-mode .panel,
  body.nav-mode .fab-container,
  body.nav-mode .leaflet-control-zoom {
    opacity: 0; pointer-events: none; transform: scale(0.95);
  }
  body.nav-mode .nav-ui { display: block; }
  
  .nav-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--paper); padding: 24px 20px 20px;
    padding-top: max(24px, env(safe-area-inset-top));
    border-radius: 0 0 24px 24px; box-shadow: var(--shadow-sm);
    text-align: center;
  }
  .nav-header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--ink); }
  .nav-header p { margin: 4px 0 0 0; font-size: 14px; color: var(--teal); font-weight: 600; }
  
  .nav-footer {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: var(--paper); padding: 20px;
    border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .nav-stats { display: flex; flex-direction: column; gap: 2px; }
  .nav-stats-top { display: flex; align-items: baseline; gap: 10px; }
  .nav-time { font-size: 28px; font-weight: 700; color: var(--teal-dark); letter-spacing: -0.5px; }
  .nav-dist { font-size: 16px; font-weight: 600; color: var(--ink-70); }
  .nav-eta { font-size: 14px; color: var(--ink-40); font-weight: 500; }
  
  .btn-exit-nav {
    background: #FFF0F0; color: var(--coral); border: none;
    padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 16px;
    cursor: pointer; transition: 0.2s; font-family: 'Work Sans', sans-serif;
  }
  .btn-exit-nav:active { background: #FFD6D6; transform: scale(0.95); }

  @media (max-width: 768px) {
    .leaflet-top.leaflet-right { margin-top: 130px; }
    .brand { display: none; }
    .search-container { left: 12px; right: 12px; width: auto; top: 16px; }
    .panel { left: 0; right: 0; bottom: 0; width: 100%; border-radius: 24px 24px 0 0; max-height: 48vh; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); }
    .panel.collapsed { border-radius: 24px 24px 0 0; }
    .fab-container { bottom: calc(48vh + 16px); right: 12px; transition: bottom 0.3s ease, opacity 0.3s; }
    .panel.collapsed ~ .fab-container { bottom: 90px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="brand">
  <h1>Fontanela</h1>
  <p>Encuentra tu fuente de agua potable.</p>
</div>

<div class="search-container">
  <div class="search-input-wrapper">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-40)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search-input" placeholder="Buscar ciudad, calle o lugar..." autocomplete="off" />
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<div class="panel collapsed" id="main-panel">
  <div class="panel-head" id="panel-head">
    <div class="panel-head-titles">
      <h2>
        Directorio
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </h2>
      <span id="count">0 fuentes</span>
    </div>
    <button id="btn-fav-filter" class="fav-filter">♡ Mis fuentes</button>
  </div>
  <div id="panel-content">
    <div id="data-source" class="data-source">Esperando conexión...</div>
    <div id="list"></div>
  </div>
</div>

<div class="fab-container">
  <button class="fab fab-locate" id="btn-locate" title="Seguir mi ubicación GPS">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
  </button>
</div>

<!-- MODO NAVEGACIÓN UI -->
<div id="nav-ui" class="nav-ui">
  <div class="nav-header">
    <h2 id="nav-title">Destino</h2>
    <p>🚶 Modo caminata</p>
  </div>
  <div class="nav-footer">
    <div class="nav-stats">
      <div class="nav-stats-top">
        <span id="nav-time" class="nav-time">-- min</span>
        <span id="nav-dist" class="nav-dist">-- m</span>
      </div>
      <span id="nav-eta" class="nav-eta">Calculando llegada...</span>
    </div>
    <button id="btn-exit-nav" class="btn-exit-nav">Salir</button>
  </div>
</div>

<div class="overlay" id="permission-overlay">
  <div class="overlay-card">
    <div class="overlay-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
    </div>
    <h2>Activa tu GPS</h2>
    <p>Fontanela necesita tu ubicación en tiempo real para calcular tiempos andando y mostrarte la ruta exacta.</p>
    <button class="btn-primary" id="allow-location">Empezar a explorar</button>
    <button class="btn-secondary" id="skip-location">Solo ver el mapa</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>

<script>
  const SPAIN_CENTER = [40.4168, -3.7038]; 
  const MAX_LIST_ITEMS = 30;

  const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView(SPAIN_CENTER, 6);
  L.control.zoom({ position: 'topright' }).addTo(map);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markersCluster = L.markerClusterGroup({
    chunkedLoading: true, 
    maxClusterRadius: 40,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 15
  });

  let fuentesFlatList = [];
  let nearestMarkerRef = null;
  let routingControl = null;
  let userMarker = null;
  let watchId = null;
  let isTracking = false;
  let currentLat = null;
  let currentLon = null;
  let lastHeading = 0;
  
  // Navigation State
  let isSharedView = false;
  let pendingRoute = null; // {lat, lon, name}
  let isNavMode = false;
  let navDestLat = null;
  let navDestLon = null;
  let routeDistRatio = 1.0; 
  
  let favorites = JSON.parse(localStorage.getItem('fontanela_favs')) || [];
  let showFavoritesOnly = false;

  const btnLocate = document.getElementById('btn-locate');
  const btnFavFilter = document.getElementById('btn-fav-filter');
  const listEl = document.getElementById('list');
  const dataSourceInfo = document.getElementById('data-source');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const mainPanel = document.getElementById('main-panel');
  const panelHead = document.getElementById('panel-head');

  panelHead.addEventListener('click', (e) => {
    if(e.target.closest('#btn-fav-filter')) return;
    mainPanel.classList.toggle('collapsed');
  });

  const dropSvg = `<svg viewBox="0 0 24 24" fill="var(--teal)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>`;
  const dropIcon = L.divIcon({ html: dropSvg, className: 'custom-drop', iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -28] });
  const dropSvgActive = `<svg viewBox="0 0 24 24" fill="var(--coral)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>`;
  const dropIconActive = L.divIcon({ html: dropSvgActive, className: 'custom-drop', iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34] });

  const userIcon = L.divIcon({
    html: `
      <div style="position:relative; width:16px; height:16px;">
        <div id="user-direction-cone" style="position:absolute; top:-32px; left:-32px; width:80px; height:80px; display:none; pointer-events:none; transition: transform 0.15s linear; transform-origin: center center;">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <defs>
              <linearGradient id="coneGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="var(--teal)" stop-opacity="0.6" />
                <stop offset="100%" stop-color="var(--teal)" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path d="M40 40 L65 10 A40 40 0 0 0 15 10 Z" fill="url(#coneGrad)" />
          </svg>
        </div>
        <div style="position:absolute; top:0; left:0; width:18px; height:18px; background:var(--coral); border:4px solid #fff; border-radius:50%; box-shadow:0 0 12px rgba(0,0,0,0.4); z-index:2; transform: translate(-1px, -1px);"></div>
      </div>
    `,
    className: 'custom-drop', 
    iconSize: [16, 16], 
    iconAnchor: [8, 8]
  });

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  window.toggleFav = function(id, name, lat, lng, event) {
    if(event) event.stopPropagation(); 
    if(favorites.includes(id)) { favorites = favorites.filter(x => x !== id); } else { favorites.push(id); }
    localStorage.setItem('fontanela_favs', JSON.stringify(favorites));
    const f = fuentesFlatList.find(x => x.lat === lat && x.lon === lng);
    if(f && f.marker && f.marker.isPopupOpen()) { f.marker.setPopupContent(window.getPopupHtml(name, lat, lng)); }
    updateListAndMap();
  };

  window.shareFountain = function(lat, lon, name, event) {
    if(event) event.stopPropagation();
    const url = new URL(window.location.href);
    url.searchParams.set('lat', lat);
    url.searchParams.set('lon', lon);
    navigator.clipboard.writeText(url.toString()).then(() => alert('¡Enlace copiado!')).catch(err => alert('Copia este enlace: ' + url.toString()));
  };

  window.getPopupHtml = function(name, lat, lon) {
    const id = `${lat},${lon}`;
    const isFav = favorites.includes(id);
    const favBtnText = isFav ? '❤️ Guardada' : '♡ Guardar';
    const safeName = name.replace(/'/g, "\\'");
    
    return `
      <div style="text-align:center;">
        <b style="font-size:16px;color:var(--ink);">${name}</b>
        <div class="popup-btn-group">
          <button class="popup-btn-sec" onclick="window.toggleFav('${id}', '${safeName}', ${lat}, ${lon}, event)">${favBtnText}</button>
          <button class="popup-btn-sec" onclick="window.shareFountain(${lat}, ${lon}, '${safeName}', event)">🔗 Compartir</button>
        </div>
        <button class="popup-btn" onclick="window.triggerRoute(${lat}, ${lon}, '${safeName}')">
          <img class="route-icon" src="location_map_directions_geography_gps_icon-icons.com_55988.webp" alt=""> Trazar Ruta
        </button>
      </div>
    `;
  };

  window.triggerRoute = function(lat, lng, name) {
    if (!currentLat) {
      pendingRoute = {lat: lat, lon: lng, name: name};
      toggleTracking();
    } else {
      drawRoute(lat, lng, name);
    }
    map.closePopup();
  };

  function drawRoute(destLat, destLon, destName) {
    isNavMode = true;
    navDestLat = destLat;
    navDestLon = destLon;
    
    document.body.classList.add('nav-mode');
    document.getElementById('nav-title').innerText = destName || 'Fuente de agua';
    
    if (routingControl) map.removeControl(routingControl);
    
    routingControl = L.Routing.control({
      waypoints: [ L.latLng(currentLat, currentLon), L.latLng(destLat, destLon) ],
      router: L.Routing.osrmv1({ language: 'es', profile: 'foot' }),
      show: false, addWaypoints: false, routeWhileDragging: false, fitSelectedRoutes: false,
      createMarker: () => null,
      lineOptions: { 
        styles: [
          {color: '#147169', opacity: 0.4, weight: 12},
          {color: '#1F9E96', opacity: 1, weight: 7} 
        ] 
      }
    }).addTo(map);

    routingControl.on('routesfound', function(e) {
      const distM = e.routes[0].summary.totalDistance; 
      let initialStraightDist = getDistance(currentLat, currentLon, destLat, destLon) * 1000;
      routeDistRatio = initialStraightDist > 0 ? (distM / initialStraightDist) : 1;
      
      updateNavUI(distM);
      map.setView([currentLat, currentLon], 18, {animate: true});
    });
  }

  function updateNavUI(distM) {
    if(distM < 20) {
      document.getElementById('nav-time').innerText = '0 min';
      document.getElementById('nav-dist').innerText = '¡Has llegado!';
      document.getElementById('nav-eta').innerText = 'Destino alcanzado';
      return;
    }
    
    const timeMin = Math.max(1, Math.round(distM / 83.3));
    const distStr = distM < 1000 ? Math.round(distM) + ' m' : (distM / 1000).toFixed(1) + ' km';
    
    const now = new Date();
    now.setMinutes(now.getMinutes() + timeMin);
    const etaStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    
    document.getElementById('nav-time').innerText = timeMin + ' min';
    document.getElementById('nav-dist').innerText = distStr;
    document.getElementById('nav-eta').innerText = 'Llegada aprox. ' + etaStr;
  }

  document.getElementById('btn-exit-nav').addEventListener('click', () => {
    document.body.classList.remove('nav-mode');
    isNavMode = false;
    navDestLat = null;
    navDestLon = null;
    if (routingControl) map.removeControl(routingControl);
    routingControl = null;
    map.setView([currentLat, currentLon], 16);
  });


  btnFavFilter.addEventListener('click', function() {
    showFavoritesOnly = !showFavoritesOnly;
    this.className = showFavoritesOnly ? 'fav-filter active' : 'fav-filter';
    this.innerText = showFavoritesOnly ? '❤️ Mis fuentes' : '♡ Mis fuentes';
    if(showFavoritesOnly) mainPanel.classList.remove('collapsed');
    updateListAndMap();
  });

  function updateListAndMap() {
    listEl.innerHTML = '';
    let listToProcess = fuentesFlatList;
    if (showFavoritesOnly) {
      listToProcess = fuentesFlatList.filter(f => favorites.includes(`${f.lat},${f.lon}`));
      dataSourceInfo.innerText = 'Tus fuentes guardadas';
    } else if (currentLat && currentLon) {
      dataSourceInfo.innerText = 'Calculando distancias a pie...';
    } else {
      dataSourceInfo.innerText = 'Busca un lugar o activa el GPS';
    }

    if (currentLat && currentLon) {
      listToProcess.forEach(f => f.dist = getDistance(currentLat, currentLon, f.lat, f.lon));
      listToProcess.sort((a, b) => a.dist - b.dist);
      fuentesFlatList.forEach(f => f.marker.setIcon(dropIcon));
      if(listToProcess.length > 0 && !showFavoritesOnly) {
        nearestMarkerRef = listToProcess[0].marker;
        nearestMarkerRef.setIcon(dropIconActive);
      }
    }

    const toShow = listToProcess.slice(0, MAX_LIST_ITEMS);
    toShow.forEach((f, index) => {
      const isNearest = (currentLat && index === 0 && !showFavoritesOnly);
      const item = document.createElement('div');
      item.className = `fountain-item ${isNearest ? 'nearest' : ''}`;
      
      let distText = ''; let timeStr = '';
      if(f.dist !== null) {
          distText = f.dist < 1 ? (f.dist * 1000).toFixed(0) + ' m' : f.dist.toFixed(1) + ' km';
          let timeMin = Math.round(f.dist * 15.6);
          timeStr = `<span class="f-time"> · 🚶 ${timeMin < 1 ? '< 1' : timeMin} min</span>`;
      }
      
      const id = `${f.lat},${f.lon}`;
      const isFav = favorites.includes(id);
      const safeName = f.name.replace(/'/g, "\\'");

      item.innerHTML = `
        <div class="f-info">
          <div class="f-dist">${distText}${timeStr}</div>
          <div class="f-name">${f.name}</div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="window.toggleFav('${id}', '${safeName}', ${f.lat}, ${f.lon}, event)">${isFav ? '❤️' : '♡'}</button>
        <div class="f-go">Ir</div>
      `;
      
      item.addEventListener('click', (e) => {
        if(e.target.tagName.toLowerCase() === 'button') return;
        markersCluster.zoomToShowLayer(f.marker, () => {
            f.marker.openPopup();
            if(window.innerWidth <= 768) mainPanel.classList.add('collapsed'); 
        });
      });
      listEl.appendChild(item);
    });
    document.getElementById('count').innerText = `${listToProcess.length} fuentes`;
  }

  fetch('fuentes.txt')
    .then(r => r.json())
    .then(data => {
        const geoJsonLayer = L.geoJSON(data, {
            pointToLayer: (feature, latlng) => {
                const name = feature.properties.name || "Fuente de agua";
                const marker = L.marker(latlng, { icon: dropIcon }).bindPopup(() => window.getPopupHtml(name, latlng.lat, latlng.lng));
                fuentesFlatList.push({ lat: latlng.lat, lon: latlng.lng, name: name, marker: marker, dist: null });
                return marker;
            }
        });
        markersCluster.addLayer(geoJsonLayer);
        map.addLayer(markersCluster);
        updateListAndMap();

        const urlParams = new URLSearchParams(window.location.search);
        const sLat = parseFloat(urlParams.get('lat'));
        const sLon = parseFloat(urlParams.get('lon'));
        
        if (sLat && sLon && !isNaN(sLat) && !isNaN(sLon)) {
            isSharedView = true;
            document.getElementById('permission-overlay').style.display = 'none';
            const sharedFuente = fuentesFlatList.find(f => Math.abs(f.lat - sLat) < 0.0001 && Math.abs(f.lon - sLon) < 0.0001);
            if (sharedFuente) {
                map.setView([sLat, sLon], 16);
                markersCluster.zoomToShowLayer(sharedFuente.marker, () => { sharedFuente.marker.openPopup(); });
            } else { map.setView([sLat, sLon], 16); }
        }
    })
    .catch(err => {
        dataSourceInfo.innerText = "Error leyendo archivo de datos.";
        dataSourceInfo.style.color = "var(--coral)";
    });

  // Buscador
  let searchTimeout;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value;
    if(query.length < 3) { searchResults.style.display = 'none'; return; }
    
    searchTimeout = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=es&limit=5&q=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
          searchResults.innerHTML = '';
          if(data.length > 0) {
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'search-result-item';
              div.innerText = item.display_name;
              
              div.addEventListener('click', () => {
                const lat = parseFloat(item.lat);
                const lon = parseFloat(item.lon);
                
                if(isTracking) {
                  navigator.geolocation.clearWatch(watchId);
                  isTracking = false;
                  btnLocate.classList.remove('tracking');
                  stopOrientation();
                }
                
                currentLat = lat; currentLon = lon;
                map.flyTo([lat, lon], 14);
                
                if(!userMarker) { userMarker = L.marker([lat, lon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map); } 
                else { userMarker.setLatLng([lat, lon]); }
                userMarker.bindPopup('Ubicación buscada').openPopup();

                updateListAndMap();
                mainPanel.classList.remove('collapsed'); 
                searchResults.style.display = 'none';
                searchInput.value = item.name || item.display_name.split(',')[0];
              });
              searchResults.appendChild(div);
            });
            searchResults.style.display = 'block';
          } else {
            searchResults.innerHTML = '<div class="search-result-item" style="color:var(--ink-40);">No se encontraron resultados</div>';
            searchResults.style.display = 'block';
          }
        });
    }, 500);
  });
  map.on('click', () => { searchResults.style.display = 'none'; });

  function handleOrientation(event) {
    let heading = null;
    if (event.webkitCompassHeading) { heading = event.webkitCompassHeading; } 
    else if (event.alpha !== null) { heading = 360 - event.alpha; }

    if (heading !== null) {
      const cone = document.getElementById('user-direction-cone');
      if (cone) {
        cone.style.display = 'block';
        const screenOrientation = window.orientation || 0; 
        const targetRotation = heading + screenOrientation;

        let diff = targetRotation - lastHeading;
        diff = ((diff + 180) % 360 + 360) % 360 - 180;
        lastHeading += diff;

        cone.style.transform = `rotate(${lastHeading}deg)`;
      }
    }
  }

  function initOrientation() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(permissionState => {
          if (permissionState === 'granted') { window.addEventListener('deviceorientation', handleOrientation, true); }
        }).catch(console.error);
    } else {
      if ('ondeviceorientationabsolute' in window) { window.addEventListener('deviceorientationabsolute', handleOrientation, true); } 
      else { window.addEventListener('deviceorientation', handleOrientation, true); }
    }
  }

  function stopOrientation() {
    window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
    window.removeEventListener('deviceorientation', handleOrientation, true);
    const cone = document.getElementById('user-direction-cone');
    if (cone) cone.style.display = 'none';
  }

  // GPS Tracking
  function toggleTracking() {
    if (isTracking) {
      navigator.geolocation.clearWatch(watchId);
      isTracking = false;
      btnLocate.classList.remove('tracking');
      stopOrientation();
    } else {
      if (!('geolocation' in navigator)) return alert('GPS no soportado.');
      
      btnLocate.classList.add('tracking');
      initOrientation();

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          
          if(!userMarker) {
            userMarker = L.marker([currentLat, currentLon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            if (!isSharedView && !pendingRoute && !isNavMode) { map.setView([currentLat, currentLon], 16); }
            mainPanel.classList.remove('collapsed'); 
          } else {
            userMarker.setLatLng([currentLat, currentLon]);
          }
          userMarker.bindPopup('Tú estás aquí');
          
          if (pendingRoute) {
            drawRoute(pendingRoute.lat, pendingRoute.lon, pendingRoute.name);
            pendingRoute = null;
          } 
          else if (isNavMode && navDestLat) {
            map.setView([currentLat, currentLon], 18, { animate: true });
            let currentStraightDist = getDistance(currentLat, currentLon, navDestLat, navDestLon) * 1000;
            let estimatedRemainM = currentStraightDist * routeDistRatio;
            updateNavUI(estimatedRemainM);
          }

          updateListAndMap();
        },
        (err) => {
          btnLocate.classList.remove('tracking');
          isTracking = false;
        },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
      );
      isTracking = true;
    }
  }

  btnLocate.addEventListener('click', () => {
    if(!isTracking) { isSharedView = false; toggleTracking(); }
    else if(currentLat) {
       map.flyTo([currentLat, currentLon], isNavMode ? 18 : 16); 
    }
  });

  document.getElementById('allow-location').addEventListener('click', () => {
    document.getElementById('permission-overlay').style.display = 'none';
    toggleTracking();
  });
  document.getElementById('skip-location').addEventListener('click', () => {
    document.getElementById('permission-overlay').style.display = 'none';
  });
</script>
</body>
</html>
