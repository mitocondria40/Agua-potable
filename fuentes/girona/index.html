  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  window.triggerRoute = function(lat, lng) {
    if (!currentLat) { statusEl.style.display = 'flex'; statusText.innerText = 'Activando GPS...'; pendingRoute = {lat: lat, lon: lng}; toggleTracking(); }

    if(window.innerWidth <= 768) mainPanel.classList.add('collapsed');
  };

  window.toggleFav = function(id, name, lat, lng, event) {
    if(event) event.stopPropagation(); 
    if(favorites.includes(id)) { favorites = favorites.filter(x => x !== id); } else { favorites.push(id); }
    localStorage.setItem('fontanela_favs', JSON.stringify(favorites));
    const f = fuentesFlatList.find(x => x.lat === lat && x.lon === lng);
    if(f && f.marker && f.marker.isPopupOpen()) { f.marker.setPopupContent(window.getPopupHtml(name, lat, lng)); }
    updateListAndMap();
  };

  window.shareFountain = function(lat, lon, name, event) {
    if(event) event.stopPropagation();
    const url = new URL(window.location.origin + window.location.pathname);
    url.searchParams.set('lat', lat); url.searchParams.set('lon', lon);
    navigator.clipboard.writeText(url.toString()).then(() => alert('¡Enlace copiado!')).catch(() => alert('Copia: ' + url.toString()));
  };

  window.getPopupHtml = function(name, lat, lon) {
    const id = `${lat},${lon}`; const isFav = favorites.includes(id); const favBtnText = isFav ? '❤️ Guardada' : '♡ Guardar';
    const safeName = name.replace(/'/g, "\\'");
    return `
      <div style="text-align:center;">
        <b style="font-size:16px;color:var(--ink);">${name}</b>
        <div class="popup-btn-group">
          <button class="popup-btn-sec" onclick="window.toggleFav('${id}', '${safeName}', ${lat}, ${lon}, event)">${favBtnText}</button>
          <button class="popup-btn-sec" onclick="window.shareFountain(${lat}, ${lon}, '${safeName}', event)">🔗 Compartir</button>
        </div>
        <button class="popup-btn" onclick="window.triggerRoute(${lat}, ${lon})">🚶 Trazar Ruta</button>
      </div>`;
  };

  btnFavFilter.addEventListener('click', function() {
    showFavoritesOnly = !showFavoritesOnly;
    this.className = showFavoritesOnly ? 'fav-filter active' : 'fav-filter';
    this.innerText = showFavoritesOnly ? '❤️ Mis fuentes' : '♡ Mis fuentes';
    if(showFavoritesOnly) mainPanel.classList.remove('collapsed');
    updateListAndMap();
  });

  function updateListAndMap() {
    listEl.innerHTML = '';
    let listToProcess = fuentesFlatList;
    if (showFavoritesOnly) { listToProcess = fuentesFlatList.filter(f => favorites.includes(`${f.lat},${f.lon}`)); dataSourceInfo.innerText = 'Tus fuentes guardadas'; } 
    else if (currentLat && currentLon) { dataSourceInfo.innerText = 'Calculando distancias a pie...'; } 
    else { dataSourceInfo.innerText = 'Fuentes en el área'; }

    if (currentLat && currentLon) {
      listToProcess.forEach(f => f.dist = getDistance(currentLat, currentLon, f.lat, f.lon));
      listToProcess.sort((a, b) => a.dist - b.dist);
      fuentesFlatList.forEach(f => f.marker.setIcon(dropIcon));
      if(listToProcess.length > 0 && !showFavoritesOnly) { nearestMarkerRef = listToProcess[0].marker; nearestMarkerRef.setIcon(dropIconActive); }
    }

    const toShow = listToProcess.slice(0, 30);
    toShow.forEach((f, index) => {
      const isNearest = (currentLat && index === 0 && !showFavoritesOnly);
      const item = document.createElement('div');
      item.className = `fountain-item ${isNearest ? 'nearest' : ''}`;
      
      let distText = ''; let timeStr = '';
      if(f.dist !== null) {
          distText = f.dist < 1 ? (f.dist * 1000).toFixed(0) + ' m' : f.dist.toFixed(1) + ' km';
          let timeMin = Math.round(f.dist * 15.6); timeStr = `<span class="f-time"> · 🚶 ${timeMin < 1 ? '< 1' : timeMin} min</span>`;
      }
      
      const id = `${f.lat},${f.lon}`; const isFav = favorites.includes(id); const safeName = f.name.replace(/'/g, "\\'");
      item.innerHTML = `
        <div class="f-info"><div class="f-dist">${distText}${timeStr}</div><div class="f-name">${f.name}</div></div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="window.toggleFav('${id}', '${safeName}', ${f.lat}, ${f.lon}, event)">${isFav ? '❤️' : '♡'}</button>
        <div class="f-go">Ir</div>`;
      item.addEventListener('click', (e) => {
        if(e.target.tagName.toLowerCase() === 'button') return;
        markersCluster.zoomToShowLayer(f.marker, () => { f.marker.openPopup(); if(currentLat) drawRoute(f.lat, f.lon); if(window.innerWidth <= 768) mainPanel.classList.add('collapsed'); });
      });
      listEl.appendChild(item);
    });
  }

  // --- CARGAR DATOS INYECTADOS DIRECTAMENTE ---
  const geoJsonLayer = L.geoJSON(OSM_GEOJSON, {
      pointToLayer: (feature, latlng) => {
          const name = feature.properties.name || "Fuente de agua";
          const marker = L.marker(latlng, { icon: dropIcon }).bindPopup(() => window.getPopupHtml(name, latlng.lat, latlng.lng));
          fuentesFlatList.push({ lat: latlng.lat, lon: latlng.lng, name: name, marker: marker, dist: null });
          return marker;
      }
  });
  markersCluster.addLayer(geoJsonLayer);
  map.addLayer(markersCluster);
  updateListAndMap();

  const urlParams = new URLSearchParams(window.location.search);
  const sLat = parseFloat(urlParams.get('lat')); const sLon = parseFloat(urlParams.get('lon'));
  if (sLat && sLon && !isNaN(sLat) && !isNaN(sLon)) {
      isSharedView = true; document.getElementById('permission-overlay').style.display = 'none';
      const sharedFuente = fuentesFlatList.find(f => Math.abs(f.lat - sLat) < 0.0001 && Math.abs(f.lon - sLon) < 0.0001);
      if (sharedFuente) { map.setView([sLat, sLon], 16); markersCluster.zoomToShowLayer(sharedFuente.marker, () => { sharedFuente.marker.openPopup(); }); } 
      else { map.setView([sLat, sLon], 16); }
  }

  let searchTimeout;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout); const query = e.target.value;
    if(query.length < 3) { searchResults.style.display = 'none'; return; }
    searchTimeout = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=es&limit=5&q=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
          searchResults.innerHTML = '';
          if(data.length > 0) {
            data.forEach(item => {
              const div = document.createElement('div'); div.className = 'search-result-item'; div.innerText = item.display_name;
              div.addEventListener('click', () => {
                const lat = parseFloat(item.lat); const lon = parseFloat(item.lon);
                if(isTracking) { navigator.geolocation.clearWatch(watchId); isTracking = false; btnLocate.classList.remove('tracking'); statusEl.style.display = 'none'; }
                currentLat = lat; currentLon = lon; map.flyTo([lat, lon], 14);
                if(!userMarker) { userMarker = L.marker([lat, lon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map); } else { userMarker.setLatLng([lat, lon]); }
                userMarker.bindPopup('Ubicación buscada').openPopup();
                updateListAndMap(); mainPanel.classList.remove('collapsed'); searchResults.style.display = 'none'; searchInput.value = item.name || item.display_name.split(',')[0];
              });
              searchResults.appendChild(div);
            });
            searchResults.style.display = 'block';
          } else { searchResults.innerHTML = '<div class="search-result-item" style="color:var(--ink-40);">No se encontraron resultados</div>'; searchResults.style.display = 'block'; }
        });
    }, 500);
  });
  map.on('click', () => { searchResults.style.display = 'none'; });

  function drawRoute(destLat, destLon) {
    if (!currentLat) return;
    if (routingControl) map.removeControl(routingControl);
    routingControl = L.Routing.control({
      waypoints: [ L.latLng(currentLat, currentLon), L.latLng(destLat, destLon) ],
      router: L.Routing.osrmv1({ language: 'es', profile: 'foot' }),
      show: false, addWaypoints: false, routeWhileDragging: false, fitSelectedRoutes: true, createMarker: () => null,
      lineOptions: { styles: [{color: 'var(--coral)', opacity: 0.8, weight: 6, dashArray: '10, 10'}] }
    }).addTo(map);

    routingControl.on('routesfound', function(e) {
      const distM = e.routes[0].summary.totalDistance; 
      const timeMin = Math.max(1, Math.round(distM / 83.3));
      const distStr = distM < 1000 ? Math.round(distM) + ' m' : (distM / 1000).toFixed(1) + ' km';
      routeInfoEl.innerHTML = `🚶 <b>${timeMin < 1 ? '< 1' : timeMin} min</b> <span style="font-size:12px; margin-left:6px; opacity:0.9;">(${distStr})</span>`;
      routeInfoEl.style.display = 'flex';
    });
    btnClearRoute.style.display = 'flex';
  }

  btnClearRoute.addEventListener('click', () => {
    if (routingControl) map.removeControl(routingControl);
    routingControl = null; btnClearRoute.style.display = 'none'; routeInfoEl.style.display = 'none';
  });

  function toggleTracking() {
    if (isTracking) {
      navigator.geolocation.clearWatch(watchId); isTracking = false; btnLocate.classList.remove('tracking'); statusEl.style.display = 'none';
    } else {
      if (!('geolocation' in navigator)) return alert('GPS no soportado.');
      statusEl.style.display = 'flex'; statusText.innerText = 'Conectando satélites...'; btnLocate.classList.add('tracking');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude; currentLon = pos.coords.longitude;
          if(!userMarker) {
            userMarker = L.marker([currentLat, currentLon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            if (!isSharedView && !pendingRoute) { map.setView([currentLat, currentLon], 16); }
            mainPanel.classList.remove('collapsed'); 
          } else { userMarker.setLatLng([currentLat, currentLon]); }
          userMarker.bindPopup('Tú estás aquí');
          
          if (pendingRoute) { drawRoute(pendingRoute.lat, pendingRoute.lon); pendingRoute = null; } 
          else if(routingControl) { routingControl.spliceWaypoints(0, 1, L.latLng(currentLat, currentLon)); }
          statusText.innerText = 'Rastreando...'; updateListAndMap();
        },
        (err) => { console.error(err); statusText.innerText = 'Error de GPS'; btnLocate.classList.remove('tracking'); isTracking = false; },
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
      );
      isTracking = true;
    }
  }

  btnLocate.addEventListener('click', () => { if(!isTracking) { isSharedView = false; toggleTracking(); } else if(currentLat) map.flyTo([currentLat, currentLon], 16); });
  document.getElementById('allow-location').addEventListener('click', () => { document.getElementById('permission-overlay').style.display = 'none'; toggleTracking(); });
  document.getElementById('skip-location').addEventListener('click', () => { document.getElementById('permission-overlay').style.display = 'none'; });
</script>
</body>
</html>
